services:
  # Next.js frontend (this repo). /api/* is proxied to the Spring Boot BFF via BFF_URL.
  - type: web
    name: utp-codefest-bff-workshop
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BFF_URL
        value: https://utp-codefest-bff.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://utp-codefest-bff-workshop.onrender.com
      - key: NEXT_PUBLIC_CLARITY_ID
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        value: O00v_7TVGbP1b25119DtcR7bWROYuDMlyvwpSpzq3lc

